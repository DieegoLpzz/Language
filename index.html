
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THVN Vape Review – Selección de idioma</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #0a0f1c, #2c2f34);
      background-attachment: fixed;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: rgba(27, 31, 36, 0.95);
      border-radius: 16px;
      padding: 50px 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 30px;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    p.subtitle {
      font-size: 15px;
      color: #bbbbbb;
      margin-bottom: 40px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .btn {
      background-color: #00bcd4;
      color: #0a0f1c;
      font-weight: 600;
      font-size: 16px;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 188, 212, 0.2);
    }

    .btn:hover {
      background-color: #00acc1;
      transform: scale(1.03);
    }

    @media (min-width: 600px) {
      .btn-group {
        flex-direction: row;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>THVN Vape Review</h1>
    <p class="subtitle">Selecciona tu idioma / Choose your language</p>
    <div class="btn-group">
      <a href="https://dieegolpzz.github.io/Thvn-vape/" class="btn">English</a>
      <a href="https://dieegolpzz.github.io/Vape-thcvn/" class="btn">Español</a>
    </div>
  </div>
</body>
</html>
